# style_tokens/layout_negative.yaml
# Maps layout.*, camera/composition, and the NEGATIVE block.
# Source: "Casual Style Dictionary" (Composition & Grid, Block List) + Banana2 negative prompt.

layout_spacing:
  tight:  { phrase: "tight spacing between elements" }
  medium: { phrase: "balanced spacing" }
  large:  { phrase: "generous spacing, airy layout" }

layout_density:
  low:    { phrase: "low density, clean and uncluttered (keep empty space)" }
  medium: { phrase: "moderate density" }
  high:   { phrase: "dense, information-rich layout" }

layout_safe_area:
  mobile: { phrase: "composed within a mobile safe area, key elements away from screen edges" }
  tablet: { phrase: "composed within a tablet safe area" }
  none:   { phrase: "full-bleed composition" }

# Camera / composition (Composition & Grid) — for screens / icon sheets
camera:
  orthographic: { phrase: "strict orthographic camera" }
  isometric:    { phrase: "isometric projection (classic 2.5D game view)" }
  top_down:     { phrase: "top-down view" }
  three_quarter: { phrase: "3/4 view" }
  close_up:     { phrase: "close-up shot" }
  eye_level:    { phrase: "eye-level shot" }
sheet:
  layout_grid:  { phrase: "asset sheet layout, <N> columns x <M> rows, consistent items" }
    # Katya: use the word 'consistent' to keep the same object across multiple angles on one sheet
  aspect_ratio: { phrase: "aspect ratio <W:H>" }
  # ASSET SHEET sub-mode (asset_spec.sheet — the icon/booster/button analogue of the UI-kit and character sheets):
  asset_sheet:  { phrase: "a single asset sheet, <N> columns x <M> rows, one item per cell in this exact order: <items> — every cell drawn in the SAME rendering, material, outline, lighting and palette, consistent items, even spacing, each item isolated in its cell on a clean transparent or solid background" }
    # every cell is a single asset → the non-screen tail still applies (no text, no UI chrome); screen-length word budget

canvas_orientation:   # style_guide.canvas.orientation — stated with the aspect ratio
  portrait:  { phrase: "portrait canvas (taller than wide)" }
  landscape: { phrase: "landscape canvas (wider than tall)" }
  square:    { phrase: "square canvas" }

# GAMEPLAY SCENE / HUD sub-mode of ASSET: (asset_spec.gameplay) — an in-game screen is UI + a play area.
gameplay_scene:
  phrase: "an in-game gameplay screen: the play area shows <setting> with <actors> — the scene follows the environment style and the actors the character style described here — framed by the HUD chrome, which is drawn in exactly the same UI style as every other screen (same materials, outline, typography and palette); the play area stays readable and uncluttered where the gameplay happens (<play_area>)"
  hud_closed_list: "the HUD contains exactly these elements and nothing more: <hud items>"
  _note: "HUD elements are UI surfaces — COLOR LOCK / SHAPE LOCK apply per surface. Tails: always-tail + 'no additional HUD elements, buttons or panels beyond those listed' — NEVER the background tail (actors are wanted) and NEVER the non-screen tail (a HUD IS UI). Actors/pieces use the character block when filled; the play area uses environment.depth / atmosphere / material.environment when filled — otherwise build from the shared dimensions and tag [AI-suggested]."

# object_spec.size_class → framing phrase (Object branch step 1)
object_size_class:
  game_piece: { phrase: "a small game piece read at board-cell size — bold simple silhouette, flat-readable at thumbnail scale, generous padding" }
  handheld:   { phrase: "a handheld pickup-scale prop" }
  furniture:  { phrase: "a furniture-scale prop (chest / barrel scale)" }
  landmark:   { phrase: "a landmark-scale object (tree / building scale)" }

# Layout-reference lock — the OUTPUT-facing twin of character_identity_lock.
# Emitted ONLY when a TARGET ref IMAGE is attached to ASSET: / BACKGROUND: / OBJECT:
# (never for YAML/text specs). Mirrors identity lock: the clause must sit in the prose so the
# downstream image generator — not just the primer LLM — reads "this image is layout only".
layout_reference_lock:
  phrase: "Use the attached image ONLY as a layout / composition reference — copy the arrangement, element positions, counts and proportions from it, but do NOT copy its colors, materials, lighting, textures, linework or art style. All visual styling follows the description above (the style guide)."
  # No "separate style reference" variant: the STYLE ref is attached ONCE (with STYLE) and the style rides in the
  # prompt via the pinned hex — a later attachment is never a style re-teach (primer §0).

# Context-setter to open the prompt (Katya: start with a clear command) — SYNTHESIZED from the
# style_guide, never a hard-coded phrase (a fixed opener biases every prompt toward one aesthetic).
context_starter:
  template: "Generate a {genre} {platform} game art asset in {rendering_family} style: ..."
  genre: "project.genre list joined with spaces (e.g. 'casual puzzle', 'horror')"
  platform: "mobile / tablet / cross-platform (project.platform)"
  rendering_family:   # short family word per style.rendering
    semi_painted: "semi-painted"
    fully_painted: "hand-painted"
    flat_vector: "flat vector"
    cel_shaded: "cel-shaded"
    3d_render: "stylized 3D"
    pixel_art: "pixel-art"
    gradient_flat: "gradient-flat"
    realistic_painted: "realistic painted"
    inked_comic: "inked comic"
  notes: >
    Naming the game-asset context at the very start helps the model understand it is drawing a
    game asset, not an ordinary picture; deriving genre + rendering from the style_guide keeps
    the opener from steering the style. Exception: the POSE VARIATION branch keeps its
    identity-lock opener (it is an image-edit prompt, not a fresh generation).

# ============ NEGATIVE / BLOCK LIST ============
# style_guide.negative -> avoidance phrases. Common Katya blocks pre-bundled.
# Selection is ref-derived (§3 rule 5): entries fire only when the keyword is in style_guide.negative —
# a cute ref bans realistic/gritty; a dark gritty ref bans cute/pastel_palette/toy_gloss instead.
# The SYNTHESIZER additionally skips any entry that contradicts a filled style_guide field
# (§4 rule 6 contradiction guard — e.g. dark_theme is dropped when background.color is dark).
negative_map:
  cute:               "NO cute / kawaii styling, NO chibi proportions, NO toy-like mascots"
  pastel_palette:     "NO pastel candy colors, NO sugary washed-out palette"
  toy_gloss:          "NO glossy plastic toy sheen, NO airbrushed cartoon polish"
  bright_cheerful:    "NO bright cheerful color pop, keep the register dark and muted"
  realistic:          "NO photorealism, NO realistic textures"
  metallic_realistic: "NO realistic metal, NO raytracing"
  dark_theme:         "NO dark theme, NO black background unless specified"
  sharp_corner:       "NO sharp geometric intersections, NO sharp points"
  flat_design:        "NO flat 2D, NO flat design"
  thin_icon:          "NO thin lines, NO thin edges, NO wire-like lines"
  gritty:             "NO gritty textures, NO grunge"
  noisy_texture:      "NO noise, NO grain, NO procedural noise, NO microscopic details"
  broken_anatomy:     "NO extra fingers, NO extra limbs, NO deformed hands"          # characters
  busy_background:    "NO clutter, NO busy detail competing with the foreground"      # backgrounds
  perspective_distortion: "NO perspective distortion, NO vanishing points (keep strict isometry)"   # Katya: add to the negative to enhance isometry
  anti_aliasing:      "NO anti-aliasing, NO blur, NO modern post-processing — pure pixel art"       # pixel_art rendering only

# Katya's standard block lists — SCOPED, not universal: katya_line_removal only for styles with no
# linework; katya_general_negatives only for clean/cute-family styles (it bans photorealism, grit and
# grain — do NOT paste it for painted / gritty / realistic / textured refs, it would erase their style):
katya_line_removal: >
  NO lineart, NO outlines, NO ink, NO stroke, NO contour lines, NO vector lines,
  NO cel shading, NO drawn lines, NO black borders, NO sketch, NO comic style, NO anime, NO manga
katya_general_negatives: >
  missing, hidden, melted silhouette, muddy, muted, dull, pale, washed out, gray, black,
  desaturated, low contrast, monochromatic, gritty textures, grain, granular or fibrous textures,
  noise, procedural noise, grunge, microscopic details,
  blurred, out of focus, depth of field, bokeh, cropped, out of frame, dry chalky texture,
  visible brushstrokes, photorealism, realistic, raw 3D render, cold 3D, filling empty space,
  high frequency patterns, small ripples, text, UI, UX, GUI,
  watermark, signature, jpeg artifacts

# Curated "Avoid:" tails distilled from the list above (primer §4 negative rule uses them):
negative_tail_always: "watermark, signature, jpeg artifacts, blurry / out of focus, cropped / out of frame"   # append to EVERY prompt
negative_tail_non_screen: "text, UI / UX / GUI overlays, interface chrome"   # single assets only (icon/button/prop/character/object/background) — a screen IS UI, skip it there
negative_tail_character: "extra fingers, extra or missing limbs, deformed hands, asymmetric eyes, broken anatomy"   # characters with normal anatomy (feature_exaggeration low/medium) — append alongside the non-screen tail
negative_tail_character_simplified: "distinct fingers or toes, paws with toes, intricate fur, tiny separate details"   # mitten/stump styles (feature_exaggeration high) — Banana2 Zero-Digits: hands/feet are smooth rounded stumps, so 'no EXTRA fingers' is the wrong guard; use this tail INSTEAD of negative_tail_character
negative_tail_background: "characters, creatures, foreground objects blocking the view"   # backgrounds only — keep the backdrop empty of actors (they are composited later); NEVER on a gameplay scene
negative_tail_no_restyle: "restyling, repainting or recoloring, changes to the face / outfit / colors, a different character"   # pose variation (CHARACTER: + CHARACTER ref) only — the image-edit prompt's own set, alongside the non-screen + character (or simplified) tails and the always tail

_note: "Katya's note: not every model supports a negative prompt; image generators read negatives as an 'Avoid: ...' sentence."
